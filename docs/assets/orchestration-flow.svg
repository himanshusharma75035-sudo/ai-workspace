<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">How the the configured assistant orchestrator coordinates multiple models</title>
  <desc id="desc">A complex request is split into workstreams, assigned to specialised local AI roles, recombined and checked before the answer is shown.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071f1a"/><stop offset="1" stop-color="#0a4939"/></linearGradient>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.22"/></filter>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bce832"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg2)"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">One request can become a coordinated AI team</text>
  <text x="60" y="103" font-family="Arial, sans-serif" font-size="17" fill="#bcd7ce">Every status shown in chat corresponds to work that actually ran.</text>

  <g filter="url(#s2)">
    <rect x="55" y="153" width="255" height="132" rx="22" fill="#ffffff"/>
    <rect x="397" y="153" width="308" height="132" rx="22" fill="#d9ff52"/>
    <rect x="820" y="153" width="325" height="132" rx="22" fill="#ffffff"/>
  </g>
  <text x="182" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0b8060">EMPLOYEE REQUEST</text>
  <text x="182" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#163c32">“Prepare a monthly</text>
  <text x="182" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#163c32">business review.”</text>
  <text x="551" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#385000">ORCHESTRATOR</text>
  <text x="551" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#163c32">Understands • Checks • Plans</text>
  <text x="551" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#385000">Breaks the goal into safe, visible workstreams</text>
  <text x="982" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0b8060">JOINED RESULT</text>
  <text x="982" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#163c32">One clear answer</text>
  <text x="982" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#50645e">Sources • language • activity trail</text>
  <path d="M310 219 H385" stroke="#bce832" stroke-width="5" marker-end="url(#a2)"/>
  <path d="M705 219 H808" stroke="#bce832" stroke-width="5" marker-end="url(#a2)"/>

  <text x="55" y="348" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#d9ff52">LIVE WORKSTREAMS</text>
  <line x1="551" y1="285" x2="551" y2="325" stroke="#bce832" stroke-width="4"/>
  <line x1="224" y1="325" x2="878" y2="325" stroke="#bce832" stroke-width="4"/>
  <line x1="224" y1="325" x2="224" y2="377" stroke="#bce832" stroke-width="4" marker-end="url(#a2)"/>
  <line x1="551" y1="325" x2="551" y2="377" stroke="#bce832" stroke-width="4" marker-end="url(#a2)"/>
  <line x1="878" y1="325" x2="878" y2="377" stroke="#bce832" stroke-width="4" marker-end="url(#a2)"/>

  <g filter="url(#s2)">
    <rect x="70" y="389" width="308" height="182" rx="22" fill="#ffffff"/>
    <rect x="397" y="389" width="308" height="182" rx="22" fill="#ffffff"/>
    <rect x="724" y="389" width="308" height="182" rx="22" fill="#ffffff"/>
  </g>
  <circle cx="112" cy="432" r="23" fill="#e7f8f0"/><text x="112" y="439" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#00684f">1</text>
  <text x="148" y="427" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#163c32">Find facts</text>
  <text x="148" y="452" font-family="Arial, sans-serif" font-size="14" fill="#0b8060">EmbeddingGemma + retrieval</text>
  <text x="102" y="493" font-family="Arial, sans-serif" font-size="15" fill="#50645e">Search approved the organization sources</text>
  <text x="102" y="518" font-family="Arial, sans-serif" font-size="15" fill="#50645e">within the employee's access.</text>
  <rect x="102" y="536" width="126" height="24" rx="12" fill="#e8f7f1"/><text x="165" y="553" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#00684f">✓ source-backed</text>

  <circle cx="439" cy="432" r="23" fill="#f1fad0"/><text x="439" y="439" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#4d6500">2</text>
  <text x="475" y="427" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#163c32">Analyse &amp; plan</text>
  <text x="475" y="452" font-family="Arial, sans-serif" font-size="14" fill="#0b8060">Qwen planner role</text>
  <text x="429" y="493" font-family="Arial, sans-serif" font-size="15" fill="#50645e">Turn a large request into</text>
  <text x="429" y="518" font-family="Arial, sans-serif" font-size="15" fill="#50645e">ordered, manageable steps.</text>
  <rect x="429" y="536" width="126" height="24" rx="12" fill="#f1fad0"/><text x="492" y="553" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#4d6500">✓ plan ready</text>

  <circle cx="766" cy="432" r="23" fill="#e7f8f0"/><text x="766" y="439" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#00684f">3</text>
  <text x="802" y="427" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#163c32">Draft &amp; explain</text>
  <text x="802" y="452" font-family="Arial, sans-serif" font-size="14" fill="#0b8060">Qwen answer role</text>
  <text x="756" y="493" font-family="Arial, sans-serif" font-size="15" fill="#50645e">Write the result clearly in</text>
  <text x="756" y="518" font-family="Arial, sans-serif" font-size="15" fill="#50645e">the employee's chosen language.</text>
  <rect x="756" y="536" width="126" height="24" rx="12" fill="#e8f7f1"/><text x="819" y="553" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#00684f">✓ draft ready</text>

  <path d="M378 480 H388" stroke="#bce832" stroke-width="4" marker-end="url(#a2)"/>
  <path d="M705 480 H715" stroke="#bce832" stroke-width="4" marker-end="url(#a2)"/>
  <path d="M1032 480 C1100 480 1100 286 982 286" fill="none" stroke="#bce832" stroke-width="4" marker-end="url(#a2)"/>

  <rect x="70" y="620" width="1062" height="58" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#5ea991"/>
  <text x="600" y="646" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Verifier: evidence found? answer complete? requested action safe?</text>
  <text x="600" y="666" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#bcd7ce">If an important external action is prepared, the employee must confirm it before execution.</text>
</svg>
