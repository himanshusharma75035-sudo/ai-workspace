<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">the configured assistant access and safety boundaries</title>
  <desc id="desc">Identity and team access are checked before public and department knowledge can reach the AI, while external actions require human confirmation.</desc>
  <defs>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbf9"/><stop offset="1" stop-color="#eff8e0"/></linearGradient>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#003d2f" flood-opacity="0.14"/></filter>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b8060"/></marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#b3)"/>
  <text x="55" y="66" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#10382e">Access is checked before knowledge reaches the AI</text>
  <text x="55" y="98" font-family="Arial, sans-serif" font-size="17" fill="#52665f">Separate team stores reduce accidental cross-department exposure.</text>

  <g filter="url(#s3)">
    <rect x="55" y="154" width="220" height="178" rx="23" fill="#ffffff" stroke="#cae2d9" stroke-width="2"/>
    <rect x="350" y="154" width="230" height="178" rx="23" fill="#073f32"/>
    <rect x="655" y="134" width="490" height="410" rx="25" fill="#ffffff" stroke="#cae2d9" stroke-width="2"/>
  </g>
  <circle cx="165" cy="201" r="30" fill="#d9ff52"/>
  <path d="M151 199 a14 14 0 1 1 28 0 M143 230 c7-18 37-18 44 0" fill="none" stroke="#00543f" stroke-width="4"/>
  <text x="165" y="267" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#163c32">Signed-in employee</text>
  <text x="165" y="295" text-anchor="middle" font-family="Arial" font-size="14" fill="#52665f">identity • role • team</text>

  <path d="M275 243 H338" stroke="#0b8060" stroke-width="5" marker-end="url(#a3)"/>
  <text x="465" y="202" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#d9ff52">ACCESS GATE</text>
  <rect x="437" y="220" width="56" height="51" rx="8" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M447 220 v-12 a18 18 0 0 1 36 0 v12" fill="none" stroke="#ffffff" stroke-width="4"/>
  <text x="465" y="303" text-anchor="middle" font-family="Arial" font-size="14" fill="#d7ece5">Allowed before retrieval</text>
  <path d="M580 243 H643" stroke="#0b8060" stroke-width="5" marker-end="url(#a3)"/>

  <text x="694" y="177" font-family="Arial" font-size="17" font-weight="700" fill="#0b8060">ONLY APPROVED KNOWLEDGE IS SEARCHED</text>
  <rect x="690" y="205" width="191" height="126" rx="18" fill="#e9f8f2"/>
  <text x="786" y="237" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#163c32">Public knowledge</text>
  <text x="786" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="#52665f">approved websites</text>
  <text x="786" y="288" text-anchor="middle" font-family="Arial" font-size="14" fill="#52665f">shared policies</text>
  <rect x="911" y="205" width="198" height="126" rx="18" fill="#f1fad0"/>
  <text x="1010" y="237" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#163c32">Employee's team</text>
  <text x="1010" y="265" text-anchor="middle" font-family="Arial" font-size="14" fill="#52665f">separate database</text>
  <text x="1010" y="288" text-anchor="middle" font-family="Arial" font-size="14" fill="#52665f">approved uploads</text>

  <rect x="690" y="362" width="419" height="142" rx="18" fill="#fff5f2" stroke="#f3b6a5"/>
  <text x="720" y="399" font-family="Arial" font-size="16" font-weight="700" fill="#9a371f">Blocked by design</text>
  <text x="720" y="430" font-family="Arial" font-size="15" fill="#6f554e">× Other departments' private knowledge</text>
  <text x="720" y="458" font-family="Arial" font-size="15" fill="#6f554e">× Unapproved documents or hidden credentials</text>
  <text x="720" y="486" font-family="Arial" font-size="15" fill="#6f554e">× Permission changes requested through chat</text>

  <path d="M900 544 V586" stroke="#0b8060" stroke-width="5" marker-end="url(#a3)"/>
  <rect x="564" y="589" width="581" height="60" rx="18" fill="#073f32"/>
  <text x="854" y="615" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">Human approval gate for important external actions</text>
  <text x="854" y="637" text-anchor="middle" font-family="Arial" font-size="13" fill="#d7ece5">Email • ticket • system update • automation</text>

  <rect x="55" y="384" width="449" height="191" rx="23" fill="#ffffff" stroke="#cae2d9" stroke-width="2" filter="url(#s3)"/>
  <text x="88" y="425" font-family="Arial" font-size="18" font-weight="700" fill="#163c32">What the answer includes</text>
  <circle cx="95" cy="460" r="10" fill="#d9ff52"/><text x="120" y="466" font-family="Arial" font-size="15" fill="#52665f">Sources for organization-specific claims</text>
  <circle cx="95" cy="495" r="10" fill="#d9ff52"/><text x="120" y="501" font-family="Arial" font-size="15" fill="#52665f">Selected language and visible progress</text>
  <circle cx="95" cy="530" r="10" fill="#d9ff52"/><text x="120" y="536" font-family="Arial" font-size="15" fill="#52665f">Audit record of important events</text>
</svg>
