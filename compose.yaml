services:
  app:
    build: .
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_SERVICE_CONTROLS: "false"
    ports:
      - "8181:8181"
    volumes:
      - app-data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  app-data:
  ollama-data:
